<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Potato Coder - Turning raw logic into crisp, high-performance software.">
    <title>Potato Coder | Enterprise Software Craftsmanship</title>
    <style>
        /* Design System Variables & Global Layout Reset */
        :root {
            --primary: #d4a373; 
            --primary-dark: #b58253;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #f4f1de;
            --text-muted: #a0a0a0;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-stack);
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .l-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        /* BLOCK: Header Component */
        .c-header {
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 0;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
        }
        .c-header__wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        .c-header__logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .c-header__menu-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .c-header__toggle-bar {
            width: 24px;
            height: 2px;
            background-color: var(--text-light);
            transition: var(--transition);
        }
        .c-header__nav-list {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .c-header__nav-list--is-open {
            display: flex !important;
        }
        .c-header__nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition);
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
        }
        .c-header__nav-link:hover {
            color: var(--primary);
        }
        .c-header__nav-link--is-active {
            color: var(--primary) !important;
            border-bottom: 2px solid var(--primary);
            font-weight: 600;
        }

        /* BLOCK: Router Target View Container */
        .c-router-view {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BLOCK: Hero Elements layout */
        .c-hero {
            padding: 5rem 0;
            text-align: center;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .c-hero__title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }
        .c-hero__title-accent {
            color: var(--primary);
        }
        .c-hero__description {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        /* BLOCK: Button Action Component */
        .c-button {
            background-color: var(--primary);
            color: #121212;
            padding: 0.85rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }
        .c-button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* BLOCK: Capabilities Grid Component */
        .c-features {
            padding: 5rem 0;
            width: 100%;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .c-features__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        /* BLOCK: Card Layout Component */
        .c-card {
            background-color: var(--bg-card);
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            transition: var(--transition);
        }
        .c-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
        }
        .c-card__title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        .c-card__description {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* HARDWARE STABLE ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* BLOCK: Responsive Media Breakpoints */
        @media (max-width: 768px) {
            .c-hero__title { font-size: 2.5rem; }
            .c-header__menu-toggle { display: flex; }
            .c-header__nav-list {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: var(--bg-dark);
                border-bottom: 1px solid #2a2a2a;
                padding: 2rem;
                gap: 1.5rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- BLOCK: Header Architecture Layer with Query Navigation Maps -->
    <header class="c-header">
        <div class="l-container c-header__wrapper">
            <a href="?page=about" class="c-header__logo c-nav-trigger" data-route="about">🥔 Potato Coder</a>
            <button class="c-header__menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
                <span class="c-header__toggle-bar"></span>
                <span class="c-header__toggle-bar"></span>
                <span class="c-header__toggle-bar"></span>
            </button>
            <ul class="c-header__nav-list" id="navLinks">
                <li><a href="?page=about" class="c-header__nav-link c-nav-trigger" data-route="about">About</a></li>
                <li><a href="?page=capabilities" class="c-header__nav-link c-nav-trigger" data-route="capabilities">Core Capabilities</a></li>
                <li><a href="?page=contact" class="c-header__nav-link c-nav-trigger" data-route="contact">Initialize Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- BLOCK: Unified Dynamic Target Root Container -->
    <main class="l-container c-router-view" id="app-view"></main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Immutable view templates containing structured markup segments
            const VIEW_REGISTRY = {
                'about': `
                    <section class="c-hero">
                        <h1 class="c-hero__title">Sprouting Scalable <span class="c-hero__title-accent">Code Architectures</span></h1>
                        <p class="c-hero__description">We are a high-performance organization engineering robust software infrastructure from scratch. No fluff, just pure deterministic output.</p>
                        <button class="c-button" onclick="appRouter.navigate('contact')">Execute Mission</button>
                    </section>
                `,
                'capabilities': `
                    <section class="c-features">
                        <h2 style="text-align:center; font-size:2rem; color:var(--primary);">Core Capabilities Matrix</h2>
                        <div class="c-features__grid">
                            <div class="c-card">
                                <h3 class="c-card__title">🥔 Deeply Rooted Logic</h3>
                                <p class="c-card__description">We build predictable systems optimized for high throughput, minimal overhead, and absolute system reliability.</p>
                            </div>
                            <div class="c-card">
                                <h3 class="c-card__title">⚡ Crisp Performance</h3>
                                <p class="c-card__description">Engineered layers designed to minimize tail latency and optimize compute utilization across distributed clouds.</p>
                            </div>
                            <div class="c-card">
                                <h3 class="c-card__title">🛡️ Hardened Skins</h3>
                                <p class="c-card__description">Zero trust parameters baked directly into our pipelines, establishing absolute runtime isolation and data security.</p>
                            </div>
                        </div>
                    </section>
                `,
                'contact': `
                    <section class="c-hero">
                        <h1 class="c-hero__title"><span class="c-hero__title-accent">Initialize Contact</span></h1>
                        <p class="c-hero__description">Connect directly with our core engineering cell. Submit system telemetry specifications or architecture inquiries.</p>
                        <div style="margin-top:2rem;">
                            <a href="mailto:ops@potatocoder.org" class="c-button" style="text-decoration:none;">Open Secured Channel</a>
                        </div>
                    </section>
                `
            };
            // Micro SPA Router Engine Architecture Class Definition
            class ParameterRouter {
                constructor(views, viewContainer, linksClass) {
                    this.views = views;
                    this.container = viewContainer;
                    this.linksClass = linksClass;
                    this.initListeners();
                }

                initListeners() {
                    // Global Event Delegation for dynamic navigation anchors
                    document.body.addEventListener('click', (e) => {
                        const targetAnchor = e.target.closest(`.${this.linksClass}`);
                        if (targetAnchor) {
                            e.preventDefault();
                            const targetState = targetAnchor.getAttribute('data-route');
                            this.navigate(targetState);
                        }
                    });

                    // Listens for browser forward/back operations cleanly over query alterations
                    window.addEventListener('popstate', () => {
                        this.renderRoute(this.getQueryState());
                    });
                }

                getQueryState() {
                    const urlParams = new URLSearchParams(window.location.search);
                    return urlParams.get('page') || 'about';
                }

                navigate(stateKey) {
                    const currentParams = new URLSearchParams(window.location.search);
                    if (currentParams.get('page') !== stateKey) {
                        const newUrl = `${window.location.pathname}?page=${stateKey}`;
                        window.history.pushState(null, null, newUrl);
                        this.renderRoute(stateKey);
                    }
                }

                renderRoute(stateKey) {
                    const cleanKey = this.views[stateKey] ? stateKey : 'about';
                    this.container.innerHTML = this.views[cleanKey];
                    this.updateActiveUIState(cleanKey);
                    
                    // Force mobile navigation menu structural collapse on component render
                    document.getElementById('navLinks').classList.remove('c-header__nav-list--is-open');
                }

                updateActiveUIState(currentKey) {
                    document.querySelectorAll(`.${this.linksClass}`).forEach(link => {
                        const targetRoute = link.getAttribute('data-route');
                        if (targetRoute === currentKey) {
                            link.classList.add('c-header__nav-link--is-active');
                        } else {
                            link.classList.remove('c-header__nav-link--is-active');
                        }
                    });
                }
            }

            // Global instance assignment and application instantiation
            window.appRouter = new ParameterRouter(
                VIEW_REGISTRY, 
                document.getElementById('app-view'), 
                'c-nav-trigger'
            );

            // Fetch initial state string directly from the file parameter segment on page entry
            appRouter.renderRoute(appRouter.getQueryState());

            // Responsive Mobile UI Hamburger Binding Engine
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');

            menuToggle.addEventListener('click', () => {
                const isOpened = navLinks.classList.toggle('c-header__nav-list--is-open');
                menuToggle.setAttribute('aria-expanded', isOpened);
            });
        });
    </script>
</body>
</html>
