<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <!-- Background Radial Circuit Gradient Mapping -->
        <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0e2340" />
            <stop offset="60%" stop-color="#071120" />
            <stop offset="100%" stop-color="#030811" />
        </radialGradient>

        <!-- Neon Cyber Cyan Glow Vector Filters -->
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur1" />
            <feGaussianBlur stdDeviation="4" result="blur2" />
            <feMerge>
                <feMergeNode in="blur1" />
                <feMergeNode in="blur2" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Canvas Processing Space -->
    <rect width="800" height="600" fill="url(#bg-glow)" />
    <!-- BLOCK: Circuit Background Geometry Trailing Tracks -->
    <g opacity="0.15" stroke="#52e5d5" stroke-width="1.5" fill="none">
        <path d="M100 300 H 260 L 310 350 M 200 150 L 280 230 V 310" />
        <path d="M 540 250 L 600 190 H 700 M 520 420 L 590 490 H 680" />
        <circle cx="260" cy="310" r="3" fill="#52e5d5" />
        <circle cx="600" cy="190" r="3" fill="#52e5d5" />
    </g>

    <!-- BLOCK: Organic Potato Core Outer Boundary Ring -->
    <g filter="url(#neon-glow)">
        <!-- Deep Cyan Outer Structural Layer -->
        <path d="M 400 130 
                 C 480 130, 560 190, 550 280 
                 C 540 370, 500 480, 410 490 
                 C 320 500, 270 440, 250 360 
                 C 230 280, 320 130, 400 130 Z" 
              fill="none" 
              stroke="#52e5d5" 
              stroke-width="5" 
              stroke-linecap="round" />
              
        <!-- Inner Micro-Channel Track Link -->
        <path d="M 405 145 
                 C 470 145, 542 200, 532 280 
                 C 522 360, 485 462, 405 472" 
              fill="none" 
              stroke="#2cb5a7" 
              stroke-width="2" 
              stroke-dasharray="8 4" 
              opacity="0.8" />
    </g>
    <!-- BLOCK: Integrated System Microchip Hub and Tracking Lines -->
    <g stroke="#2cb5a7" stroke-width="1.5" fill="none" opacity="0.6">
        <path d="M 320 330 H 280 L 260 310" />
        <path d="M 430 240 V 200 L 410 180" />
        <path d="M 460 310 H 510 L 530 330" />
    </g>

    <!-- BLOCK: Central Core Microchip Interface Processor -->
    <g filter="url(#soft-glow)">
        <!-- Base Silicon Die Geometry -->
        <rect x="365" y="295" width="50" height="50" rx="6" fill="#0d1e36" stroke="#52e5d5" stroke-width="2.5" />
        
        <!-- Central Processing Unit Nodes -->
        <circle cx="390" cy="320" r="10" fill="none" stroke="#52e5d5" stroke-width="1.5" />
        <path d="M 390 305 V 335 M 375 320 H 405" stroke="#52e5d5" stroke-width="1.5" />
        
        <!-- Peripheral Pins Interface Matrix -->
        <path d="M 380 290 V 295 M 390 290 V 295 M 400 290 V 295
                 M 380 345 V 350 M 390 345 V 350 M 400 345 V 350
                 M 360 310 H 365 M 360 320 H 365 M 360 330 H 365
                 M 415 310 H 420 M 415 320 H 420 M 415 330 H 420" 
              stroke="#52e5d5" 
              stroke-width="2" 
              stroke-linecap="round" />
    </g>

    <!-- BLOCK: Developer Terminal Core Character Symbols -->
    <g filter="url(#neon-glow)" stroke="#52e5d5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Interactive Prompt Terminal Character Operator (>) -->
        <path d="M 315 295 L 340 315 L 315 335" />
        
        <!-- System IDE Structural Scope Enclosure Block (}) -->
        <path d="M 455 285 C 465 285, 465 305, 470 310 C 465 315, 465 335, 455 335" />
    </g>

    <!-- BLOCK: Embedded Corporate Cryptographic Data Array -->
    <g fill="#52e5d5" font-family="Consolas, Monaco, 'Andale Mono', monospace" font-weight="bold" letter-spacing="1">
        <!-- High-Throughput Upper Binary Stream Nodes -->
        <text x="445" y="215" font-size="19" opacity="0.95" filter="url(#soft-glow)">010101</text>
        <text x="415" y="238" font-size="20" opacity="0.95" filter="url(#soft-glow)">0101010</text>
        
        <!-- Lower Base Compilation Signal Status Indicator -->
        <text x="362" y="380" font-size="17" opacity="0.85" filter="url(#soft-glow)">1110</text>
    </g>

    <!-- BLOCK: Asymmetric Low-Level Biological Neural Core Map -->
    <g stroke="#2cb5a7" stroke-width="1" fill="none" opacity="0.4">
        <!-- Base Node Intersection Graph Shell -->
        <path d="M 280 390 L 310 440 L 370 470 L 320 420 Z" />
        <path d="M 310 440 L 320 420 M 280 390 L 320 420 M 370 470 L 320 420" />
        <path d="M 460 410 L 490 370 L 515 420 L 440 450 Z" />
        <path d="M 490 370 L 440 450 M 460 410 L 440 450" />
        
        <!-- Micro-Terminal Connection Pins -->
        <circle cx="310" cy="440" r="2" fill="#2cb5a7" />
        <circle cx="370" cy="470" r="2" fill="#2cb5a7" />
        <circle cx="490" cy="370" r="2" fill="#2cb5a7" />
        <circle cx="440" cy="450" r="2" fill="#2cb5a7" />
    </g>
    
    <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
        
        <!-- Primary Structural Title Header (POTATO CODER) -->
        <text x="400" y="555" 
              font-size="52" 
              font-weight="900" 
              fill="#ffffff" 
              letter-spacing="5" 
              opacity="0.95"
              filter="url(#soft-glow)">POTATO CODER</text>
              
        <!-- Cyber Cyan Underline Highlight Glow Element -->
        <text x="400" y="555" 
              font-size="52" 
              font-weight="900" 
              fill="#52e5d5" 
              letter-spacing="5" 
              opacity="0.6"
              filter="url(#neon-glow)">POTATO CODER</text>

        <!-- Technical Operational Subheading Description -->
        <text x="400" y="590" 
              font-size="16" 
              font-weight="600" 
              fill="#6b829e" 
              letter-spacing="3" 
              opacity="0.85">SYSTEM &amp; APPLICATION DEVELOPMENT</text>
    </g>
</svg>
